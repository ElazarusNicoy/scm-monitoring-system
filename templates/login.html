<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login Interface</title>
    <!-- <link rel="stylesheet" href="static/css/login.css"> -->
     <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="container">
        <div class="description-panel">
            <h1>Welcome to the SCM Monitoring System</h1>
            <p>This interface allows users to log in to the system. Please enter your credentials to access the workflow tracking features.</p>
        </div>
        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <!-- <script src="static/js/login.js"></script> -->
     <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
