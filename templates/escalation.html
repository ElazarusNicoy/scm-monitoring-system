<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCM Monitoring System - Escalation</title>
    <link rel="stylesheet" href="static/css/escalation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-chart-line"></i> SCM Monitoring System</h1>
                <div class="header-info">
                    <span class="auto-email-indicator" id="autoEmailIndicator" style="display: none;">
                        <i class="fas fa-robot"></i> Auto-escalation active
                    </span>
                    <span class="current-time" id="currentTime"></span>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="nav-tab" onclick="window.location.href='workflow-tracking.html'">
                <i class="fas fa-stream"></i> Workflow Tracking
            </button>
            <button class="nav-tab active">
                <i class="fas fa-bell"></i> Escalation
            </button>
            <button class="nav-tab" onclick="window.location.href='reports.html'"> 
                <i class="fas fa-file-alt"></i> Reports
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Dashboard Summary Cards -->
            <section class="dashboard-summary">
                <div class="summary-card card-warning" data-filter-type="aging" data-filter-value="warning" title="Click to filter Warning aged transactions">
                    <div class="card-icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="card-content">
                        <div class="card-header-row">
                            <h3 id="warningCount">0</h3>
                        </div>
                        <p>Warning</p>
                    </div>
                </div>

                <div class="summary-card card-critical" data-filter-type="aging" data-filter-value="critical" title="Click to filter Critical aged transactions">
                    <div class="card-icon"><i class="fas fa-fire"></i></div>
                    <div class="card-content">
                        <div class="card-header-row">
                            <h3 id="criticalCount">0</h3>
                        </div>
                        <p>Critical</p>
                    </div>
                </div>
            </section>

            <!-- Filters and Search -->
            <section class="filters-section">
                <div class="filters-container">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search by Transaction Name, Current Stage, Current PIC, or Requestor">
                    </div>
                    <div class="filter-group">
                        <label for="transactionTypeFilter">Transaction Type:</label>
                        <select id="transactionTypeFilter">
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="stageFilter">Stage:</label>
                        <select id="stageFilter">
                            <option value="all">All Stages</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="currentPICFilter">Current PIC:</label>
                        <select id="currentPICFilter">
                            <option value="all">All PICs</option>
                        </select>

                    </div>
                    <div class="filter-group">
                        <label for="agingFilter">Aging:</label>
                        <select id="agingFilter">
                            <option value="all">All</option>
                            <option value="warning">Warning</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <button class="btn-refresh" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </section>

            <!-- Transactions Table -->
            <section class="transactions-section">
                <div class="section-header">
                    <h2><i class="fas fa-bell"></i> Aging Transactions</h2>
                    <div class="transaction-count-metric">
                        <span class="metric-showing">
                            Showing <strong id="shownTransactionCount">0</strong> of
                        </span>
                        <span class="metric-total">
                            <strong id="totalTransactionCount">0</strong> total transactions
                        </span>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="table">
                            <i class="fas fa-table"></i> Table View
                        </button>
                        <button class="view-btn" data-view="card">
                            <i class="fas fa-th-large"></i> Card View
                        </button>
                    </div>
                </div>

                <!-- Table View -->
                <div class="table-container" id="tableView">
                    <table class="transactions-table">
                        <thead>
                            <tr>
                                <th>Transaction Name</th>
                                <th>Current Stage</th>
                                <th>Current PIC</th>
                                <th>Aging (Days)</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody">
                            <!-- Transactions will be populated here -->
                        </tbody>
                    </table>
                </div>

                <!-- Card View -->
                <div class="cards-container hidden" id="cardView">
                    <!-- Transaction cards will be populated here -->
                </div>

                <!-- Pagination -->
                <div class="pagination">
                    <button class="pagination-btn" id="prevPage">
                        <i class="fas fa-chevron-left"></i> Previous
                    </button>
                    <span class="pagination-info">
                        Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
                    </span>
                    <button class="pagination-btn" id="nextPage">
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </section>
        </main>

        <!-- Transaction Detail Modal -->
        <div class="modal" id="transactionModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fas fa-info-circle"></i> Transaction Details</h2>
                    <button class="modal-close" id="closeModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Transaction details will be populated here -->
                </div>
            </div>
        </div>

        <!-- Email Preview Modal -->
         <div class="email-preview-modal" id="emailPreviewModal">
            <div class="email-preview-content">
                <div class="email-preview-header">
                    <h3><i class="fas fa-envelope"></i> Follow-up Email Preview</h3>
                    <button class="email-preview-close" id="closeEmailPreview">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="email-preview-body">
                    <div class="email-header-section">
                        <div class="email-field">
                            <span class="email-field-label">To:</span>
                            <span class="email-field-value" id="emailTo"></span>
                        </div>
                        <div class="email-field">
                            <span class="email-field-label">Cc:</span>
                            <span class="email-field-value" id="emailCc"></span>
                        </div>
                        <div class="email-field">
                            <span class="email-field-label">Subject:</span>
                            <span class="email-field-value email-subject" id="emailSubject"></span>
                        </div>
                    </div>
                    <div class="email-content-section" id="emailContentSection">
                        <!-- Email content will be populated here -->
                    </div>
                </div>
                <div class="email-preview-footer">
                    <button class="btn-email-action btn-cancel-email" id="cancelEmailBtn">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button class="btn-email-action btn-send-email" id="sendEmailBtn">
                        <i class="fas fa-paper-plane"></i> Send Email
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/escalation.js"></script>
</body>
</html>
